name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inspect Files and Extract Archive
        run: |
          echo "=== Root Files ==="
          ls -la
          
          # Locate the uploaded archive file
          ARCHIVE=$(find . -maxdepth 1 -type f ! -name "README.md" ! -name ".*" | head -n 1)
          echo "Found file: $ARCHIVE"
          
          if [ -z "$ARCHIVE" ]; then
            echo "Error: No uploaded archive found in repository root!"
            exit 1
          fi

          # Copy file and extract using multiple tools
          cp "$ARCHIVE" project.zip
          unzip -o project.zip || 7z x project.zip || tar -xvf project.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant Execute Permission for Gradlew
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew file not found inside extracted archive!"
            exit 1
          fi
          echo "Found gradlew at: $GRADLEW_PATH"
          chmod +x "$GRADLEW_PATH"

      - name: Build Debug APK
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"
          
